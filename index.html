<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Midstar Investor Profile</title>
  <meta name="description" content="Learn the basics of investing and discover your investor risk profile. Available in English and Arabic.">
  <meta name="theme-color" content="#FBF8F1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%239C7A36'/%3E%3Cpath d='M7 23V9l9 9 9-9v14' fill='none' stroke='%23fff' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Lora:wght@500;600&family=Noto+Naskh+Arabic:wght@500;600&display=swap">
  <style>
/* Layout: sticky bar, then one centred column (max 1080px); slide viewer and questionnaire are single focused cards. Palette follows the Midstar "Introduction to Investing" deck: ivory, sand, antique gold. */
:root{
  --bg:#FBF8F1; --surface:#FFFFFF; --sand:#F3E9D2; --sand-2:#EADBB8; --line:#E4D8BE;
  --ink:#2B2620; --muted:#6B6254; --gold:#9C7A36; --gold-ink:#7A5E25; --on-gold:#FFFFFF;
  --gain:#4E9A3F; --loss:#D9622B;
  --p1:#1E8A4C; --p1-ink:#FFFFFF; --p2:#93C54B; --p2-ink:#1F2A10; --p3:#EBC433; --p3-ink:#2B2306; --p4:#B8322A; --p4-ink:#FFFFFF;
  --ok:#2F7D46; --ok-bg:#E5F2E8; --warn:#9A5B12; --warn-bg:#FBEBD3;
  --f-display:"Lora","Noto Naskh Arabic",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(60,45,20,.06),0 8px 24px rgba(60,45,20,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15130F; --surface:#1E1B16; --sand:#2A251C; --sand-2:#3A3226; --line:#3A3429;
  --ink:#F1EADB; --muted:#ABA08B; --gold:#D4B06A; --gold-ink:#E2C389; --on-gold:#1A160F;
  --gain:#7CC46A; --loss:#F08A55;
  --ok:#86D29B; --ok-bg:#1D3326; --warn:#F2B866; --warn-bg:#3A2A14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#15130F; --surface:#1E1B16; --sand:#2A251C; --sand-2:#3A3226; --line:#3A3429;
  --ink:#F1EADB; --muted:#ABA08B; --gold:#D4B06A; --gold-ink:#E2C389; --on-gold:#1A160F;
  --gain:#7CC46A; --loss:#F08A55;
  --ok:#86D29B; --ok-bg:#1D3326; --warn:#F2B866; --warn-bg:#3A2A14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:500;line-height:1.25;text-wrap:balance;margin:0;color:var(--ink)}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--gold-ink)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);font-weight:600}
[dir="rtl"] .eyebrow{letter-spacing:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:baseline;gap:10px;margin-inline-end:auto;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--f-display);font-size:21px;font-weight:600;letter-spacing:.04em}
.brand span{font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;white-space:nowrap;color:var(--muted);font-weight:500}
nav.tabs button[aria-current="page"]{background:var(--sand);color:var(--ink)}
.lang{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600}

main{padding-block:32px 64px}
section.view{display:grid;gap:28px}

/* Home */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center;padding-block:16px}
.hero h1{font-size:clamp(30px,4.4vw,46px)}
.hero p.lead{font-size:18px;color:var(--muted);margin-top:14px;max-width:56ch}
.hero-art{background:var(--sand);border-radius:16px;padding:20px;min-width:0}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:11px 18px;font-weight:600;border:1px solid transparent;text-decoration:none}
.btn.primary{background:var(--gold);color:var(--on-gold)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.small{padding:7px 12px;font-size:14px}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:8px;align-content:start;min-width:0}
.card h3{font-size:20px}
.card .go{margin-top:6px;justify-self:start}
.steps-mini{display:grid;gap:10px;font-size:15px}
.steps-mini div{display:flex;gap:10px;align-items:flex-start}
.steps-mini i{font-style:normal;flex:none;width:26px;height:26px;border-radius:50%;background:var(--surface);border:1px solid var(--sand-2);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--gold-ink)}

/* Learn: slide viewer */
.learn-head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--sand);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.deck{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.slide{padding:clamp(20px,4vw,44px);min-height:440px;display:grid;gap:18px;align-content:start}
.slide h2{font-size:clamp(24px,3vw,34px)}
.slide .bullets{display:grid;gap:8px;padding-inline-start:20px;margin:0;max-width:72ch}
.slide .bullets li::marker{color:var(--gold)}
.deck-foot{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:12px 16px;background:var(--bg)}
.deck-foot .count{margin-inline-start:auto;margin-inline-end:auto;font-size:14px;color:var(--muted)}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots button{width:9px;height:9px;padding:0;border-radius:50%;border:0;background:var(--sand-2)}
.dots button[aria-current="true"]{background:var(--gold);width:22px;border-radius:5px}
.title-slide{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;min-height:380px}
.title-slide h2{font-size:clamp(32px,5vw,52px)}
.title-art{aspect-ratio:4/3;max-width:100%;border-radius:12px;background:var(--sand);display:grid;place-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{background:var(--sand);border-radius:12px;padding:16px;display:grid;gap:6px;align-content:start;min-width:0}
.tile h4{font-size:18px}
.tile p,.tile li{font-size:15px;color:var(--muted)}
.tile ul{margin:0;padding-inline-start:18px;display:grid;gap:4px}
.tile .ic{width:34px;height:34px;color:var(--gold-ink)}
.tile.plain{background:transparent;border:1px solid var(--line)}
.example{border:1px dashed var(--gold);border-radius:12px;padding:14px 16px;background:color-mix(in srgb,var(--sand) 50%,transparent);display:grid;gap:4px;max-width:80ch}
.example b.tag{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink)}
[dir="rtl"] .example b.tag{letter-spacing:0}
.takeaway{border-inline-start:3px solid var(--gold);padding-inline-start:14px;font-weight:500}
.disclaimer{font-size:13px;color:var(--muted)}
.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;position:relative}
.timeline .tile{border-top:4px solid var(--gold)}
.timeline .tile:nth-child(1){border-top-color:var(--p2)}
.timeline .tile:nth-child(3){border-top-color:var(--p4)}

/* Simulators */
.sim{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;min-width:0}
.sim h4{font-size:18px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.ctl{display:grid;gap:4px;font-size:14px}
.ctl label{color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.ctl label output{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--gold)}
.statrow{display:flex;gap:24px;flex-wrap:wrap}
.stat{display:grid}
.stat .v{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.stat .k{font-size:13px;color:var(--muted)}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:520px}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:12px}
.chart .grid line{stroke:var(--line)}
.alloc-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.alloc-table th,.alloc-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
.alloc-table th:first-child,.alloc-table td:first-child{text-align:start}
.alloc-table tr.sel td,.alloc-table th.sel{background:var(--sand)}
.alloc-table thead button{border:0;background:none;font-weight:600;padding:4px 8px;border-radius:6px}
.alloc-table thead th.sel button{color:var(--gold-ink)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:8px;vertical-align:middle}
.tblwrap{overflow-x:auto}

/* Questionnaire */
.quiz{display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rail li button{width:100%;text-align:start;border:0;background:none;padding:6px 8px;border-radius:8px;display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
.rail li button[aria-current="step"]{background:var(--sand);color:var(--ink);font-weight:600}
.rail li button:disabled{cursor:default;opacity:.55}
.rail .tick{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--sand-2);flex:none;display:grid;place-items:center;font-size:11px}
.rail .done .tick{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.rail .part{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink);font-weight:600;padding:8px 8px 2px}
[dir="rtl"] .rail .part{letter-spacing:0}
.progress{height:6px;background:var(--sand);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);transition:width .3s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:clamp(20px,4vw,36px);display:grid;gap:18px;min-width:0}
.qcard h2{font-size:clamp(21px,2.6vw,27px);max-width:60ch}
.help-toggle{justify-self:start;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;display:inline-flex;gap:8px;align-items:center}
.help{background:var(--sand);border-radius:12px;padding:14px 16px;display:grid;gap:8px;font-size:15px;max-width:72ch}
.help .ex{border-top:1px solid var(--sand-2);padding-top:8px}
.help .ex b{color:var(--gold-ink)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;background:var(--surface);transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--sand-2)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--sand-2);margin-top:2px;display:grid;place-items:center}
.opt.on{border-color:var(--gold);background:color-mix(in srgb,var(--sand) 55%,var(--surface))}
.opt.on .dot{border-color:var(--gold)}
.opt.on .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold)}
.opt .body{display:grid;gap:4px;min-width:0;flex:1}
.opt .body small{color:var(--muted);font-size:14px}
.opt .pts{margin-inline-start:auto;font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.range-viz{height:22px;position:relative;background:var(--bg);border-radius:4px;margin-top:4px;max-width:420px}
.range-viz .base{position:absolute;top:0;bottom:0;width:1.5px;background:var(--ink);opacity:.6}
.range-viz .dn{position:absolute;top:5px;bottom:5px;background:var(--loss);border-radius:3px 0 0 3px}
.range-viz .up{position:absolute;top:5px;bottom:5px;background:var(--gain);border-radius:0 3px 3px 0}
.qnav{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.field{display:grid;gap:6px;font-size:14px}
.field input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;background:var(--sand);border-radius:999px;padding:4px 10px}
.adv{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}

/* Results */
.result-head{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:10px;border-radius:12px;padding:10px 16px;font-family:var(--f-display);font-size:24px;font-weight:600}
.badge.p1{background:var(--p1);color:var(--p1-ink)}.badge.p2{background:var(--p2);color:var(--p2-ink)}.badge.p3{background:var(--p3);color:var(--p3-ink)}.badge.p4{background:var(--p4);color:var(--p4-ink)}
.scores{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.meter{display:grid;gap:6px}
.meter .bar2{height:10px;background:var(--sand);border-radius:5px;overflow:hidden}
.meter .bar2 i{display:block;height:100%;background:var(--gold)}
.meter .top{display:flex;justify-content:space-between;align-items:baseline}
.meter .top b{font-family:var(--f-display);font-size:28px;font-weight:500;font-variant-numeric:tabular-nums}
.matrix-wrap{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;align-items:center}
.matrix svg{width:100%;max-width:520px;height:auto;display:block}
.matrix text{font-family:var(--f-body);font-size:12px;fill:var(--muted)}
.legend{display:grid;gap:8px;font-size:14px}
.legend div{display:flex;gap:10px;align-items:center}
.legend i{width:16px;height:16px;border-radius:4px;flex:none}
.verdict{border-radius:12px;padding:14px 16px;display:grid;gap:4px}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.no{background:var(--warn-bg);color:var(--warn)}
.verdict b{font-size:16px}
.verdict p{color:var(--ink);font-size:15px}
.ans-table{width:100%;border-collapse:collapse;font-size:14px}
.ans-table th,.ans-table td{text-align:start;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.ans-table td.p{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.ans-table tfoot td{font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40}
footer{border-top:1px solid var(--line);padding-block:20px;font-size:13px;color:var(--muted)}

@media (max-width:860px){
  .hero,.title-slide,.matrix-wrap,.quiz{grid-template-columns:1fr}
  .rail{position:static}
  .rail ol{display:none}
  .cards3,.grid3,.grid4,.timeline{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:560px){
  .cards3,.grid2,.grid3,.grid4,.timeline,.scores,.fields{grid-template-columns:1fr}
  .result-head{grid-template-columns:1fr}
  .slide{min-height:0}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .bar,.rail,.qnav,.actions,footer,.adv{display:none!important}
  body{background:#fff}
  .quiz{grid-template-columns:1fr}
  .qcard{box-shadow:none;border:0}
}
.grid1{display:grid;gap:12px}
.ic16{width:16px;height:16px;flex:none}
.opt{position:relative}
.tile .ic,.card .ic{width:30px;height:30px;color:var(--gold-ink)}
[dir="rtl"] .flip{transform:scaleX(-1)}

</style>
  <style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}[hidden]{display:none!important}img{max-width:100%}</style>

  <noscript><p style="padding:24px">This site needs JavaScript to run. Please enable it in your browser.</p></noscript>
  <script>
/* Midstar Investor Profile — content (English + Arabic).
   Edit wording, questions, points, slides and simulator data here.
   Scoring rules (bands and matrix) are also defined in this file. */
/* ===== Content: UI strings, questionnaire, presentation. Edit text here; both languages sit side by side. ===== */
const L = (en, ar) => ({ en, ar });

const UI = {
  brandSub: L("Investor Profile", "ملف المستثمر"),
  nav: { home: L("Home", "الرئيسية"), learn: L("Learn to invest", "تعلّم الاستثمار"), quiz: L("Risk profile", "ملف المخاطر"), tools: L("Simulators", "أدوات المحاكاة") },
  langBtn: L("العربية", "English"),
  heroEyebrow: L("Midstar · Know your investor", "ميدستار · اعرف المستثمر"),
  heroTitle: L("Understand investing, then find the risk profile that fits you", "افهم الاستثمار، ثم اكتشف ملف المخاطر الذي يناسبك"),
  heroLead: L("Start with a short guide to how investing works. Then answer 12 questions about your experience, goals and comfort with ups and downs. Your profile is calculated instantly.", "ابدأ بدليل قصير يشرح كيف يعمل الاستثمار، ثم أجب عن 12 سؤالاً حول خبرتك وأهدافك ومدى ارتياحك لتقلبات السوق. يُحتسب ملفك فوراً."),
  ctaQuiz: L("Start the questionnaire", "ابدأ الاستبيان"),
  ctaLearn: L("Read the guide first", "اقرأ الدليل أولاً"),
  howTitle: L("How it works", "كيف يعمل"),
  how: [L("Learn the basics: time horizon, risk, asset classes", "تعلّم الأساسيات: الأفق الزمني، المخاطر، فئات الأصول"), L("Answer 11 scored questions in two parts: risk and liquidity", "أجب عن 11 سؤالاً محسوب النقاط في جزأين: المخاطر والسيولة"), L("Choose the statement that best describes you", "اختر العبارة التي تصفك بشكل أفضل"), L("See your profile and whether it matches your own view", "اطّلع على ملفك ومدى توافقه مع تقييمك الذاتي")],
  card1T: L("Introduction to Investing", "مقدمة في الاستثمار"),

function niceMax(v) { if (v <= 0) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * e >= v) return m * e; return 10 * e; }
function lineChart(series, xLabel) {
  const W = 860, H = 300, pl = 64, pr = 16, pt = 14, pb = 34;
  const xs = series[0].pts.map(p => p[0]), xMax = Math.max(...xs) || 1;
  const yMax = niceMax(Math.max(...series.flatMap(s => s.pts.map(p => p[1]))));
  const X = x => pl + (x / xMax) * (W - pl - pr), Y = y => pt + (1 - y / yMax) * (H - pt - pb);
  const ticks = [0, .2, .4, .6, .8, 1].map(f => f * yMax);
  const xt = []; const step = Math.max(1, Math.ceil(xMax / 8)); for (let x = 0; x <= xMax; x += step) xt.push(x);
  const lines = series.map(s => {
    const d = s.pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ");
    const last = s.pts[s.pts.length - 1];
    return (s.area ? `<path d="${d} L${X(last[0])} ${Y(0)} L${X(0)} ${Y(0)} Z" fill="${s.color}" opacity=".12"/>` : "") +
      `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" ${s.dash ? 'stroke-dasharray="5 4"' : ""}/><circle cx="${X(last[0])}" cy="${Y(last[1])}" r="4" fill="${s.color}"/>`;
  }).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" direction="ltr" role="img">
    <g class="grid">${ticks.map(v => `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}"/>`).join("")}</g>
    ${ticks.map(v => `<text x="${pl - 8}" y="${Y(v) + 4}" text-anchor="end">${usdShort(v)}</text>`).join("")}
    ${xt.map(x => `<text x="${X(x)}" y="${H - 14}" text-anchor="middle">${x}</text>`).join("")}
    <text x="${W - pr}" y="${H - 1}" text-anchor="end">${esc(xLabel)}</text>
    ${lines}</svg></div>
    <div class="legend" style="display:flex;gap:18px;flex-wrap:wrap">${series.map(s => `<div><i style="background:${s.color}"></i>${esc(s.name)}</div>`).join("")}</div>`;
}
function rrChart(mult) {
  const W = 860, H = 320, pl = 64, pr = 12, pt = 24, pb = 46;
  const yTop = niceMax(7000 * mult), yBot = -niceMax(1000 * mult);
  const Y = v => pt + (yTop - v) / (yTop - yBot) * (H - pt - pb);
  const n = RISK_REWARD.length, bw = (W - pl - pr) / n;
  const ticks = []; for (let i = 0; i <= 7; i++) ticks.push(yBot + (yTop - yBot) * i / 7);
  const nice = [yBot, 0, ...[0.25, .5, .75, 1].map(f => f * yTop)];
  const bars = RISK_REWARD.map((r, i) => {
    const x = pl + i * bw + bw * 0.3, w = bw * 0.4, up = r.up * mult, dn = r.dn * mult;
    return `<rect x="${x}" y="${Y(up)}" width="${w}" height="${Y(0) - Y(up)}" fill="var(--gain)" rx="2"/>
      <rect x="${x}" y="${Y(0)}" width="${w}" height="${Y(dn) - Y(0)}" fill="var(--loss)" rx="2"/>
      <text x="${x + w / 2}" y="${Y(up) - 6}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${usdLab(up)}</text>
      <text x="${x + w / 2}" y="${Y(dn) + 14}" text-anchor="middle" style="fill:var(--loss)">${usdLab(dn)}</text>
      <text x="${pl + i * bw + bw / 2}" y="${H - 18}" text-anchor="middle">${esc(pick(r.n))}</text>`;
  }).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" direction="ltr" role="img">
    <g class="grid">${nice.map(v => `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}"/>`).join("")}</g>
    <line x1="${pl}" x2="${W - pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ink)" opacity=".5"/>
    ${nice.map(v => `<text x="${pl - 8}" y="${Y(v) + 4}" text-anchor="end">${usdShort(v)}</text>`).join("")}
    ${bars}</svg></div>
    <div class="legend" style="display:flex;gap:18px;flex-wrap:wrap"><div><i style="background:var(--gain)"></i>${t(SIM_TXT.gain)}</div><div><i style="background:var(--loss)"></i>${t(SIM_TXT.loss)}</div></div>`;
}
function curveSVG() {
  const W = 420, H = 260, P = [[70, 200], [210, 120], [360, 70]];
  const lbl = [SIM_TXT.veryCons, SIM_TXT.moderate, SIM_TXT.veryAgg];
  return `<svg viewBox="0 0 ${W} ${H}" direction="ltr" style="min-width:0;max-width:440px" role="img">
    <path d="M40 230 H400 M40 230 V20" stroke="var(--muted)" fill="none"/>
    <path d="M45 225 C 120 170, 220 100, 395 62" stroke="var(--gold)" stroke-width="3" fill="none"/>
    ${P.map((p, i) => `<line x1="${p[0]}" y1="${p[1]}" x2="${p[0]}" y2="${p[1] - 32}" stroke="var(--muted)"/><circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--ink)"/><text x="${p[0]}" y="${p[1] - 38}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${t(lbl[i])}</text>`).join("")}
    <text x="220" y="252" text-anchor="middle">${t(SIM_TXT.curveX)}</text>
    <text x="16" y="125" text-anchor="middle" transform="rotate(-90 16 125)">${t(SIM_TXT.curveY)}</text></svg>`;
}
function allocView() {
  const sel = S.sim.alloc.sel, W = 860, H = 260, pl = 44, pb = 44, bw = (W - pl - 10) / 5;
  const bars = ALLOC.cols.map((c, i) => {
    let y = H - pb; const x = pl + i * bw + bw * .2, w = bw * .6, sc = (H - pb - 12) / 100;
    const segs = ALLOC.rows.map(r => { const h = r.v[i] * sc; y -= h; return h ? `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${r.c}"/>` : ""; }).join("");
    return `<g data-alloc="${i}" style="cursor:pointer" opacity="${i === sel ? 1 : .45}">${segs}<rect x="${x - 4}" y="10" width="${w + 8}" height="${H - pb - 8}" fill="transparent"/><text x="${x + w / 2}" y="${H - 22}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${c.id}</text><text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${esc(pick(c.n))}</text></g>`;
  }).join("");
  return `<div class="tblwrap"><table class="alloc-table">
    <thead><tr><th>${t(SIM_TXT.profile)}</th>${ALLOC.cols.map((c, i) => `<th class="${i === sel ? "sel" : ""}"><button data-alloc="${i}">${c.id}</button></th>`).join("")}</tr>
    <tr><th>${t(SIM_TXT.strategy)}</th>${ALLOC.cols.map((c, i) => `<th class="${i === sel ? "sel" : ""}" style="font-weight:500">${t(c.n)}</th>`).join("")}</tr></thead>
    <tbody><tr><td colspan="6" class="muted" style="font-size:13px">${t(SIM_TXT.classes)}</td></tr>${ALLOC.rows.map(r => `<tr><td><span class="swatch" style="background:${r.c}"></span>${t(r.n)}</td>${r.v.map((v, i) => `<td class="${i === sel ? "sel" : ""}" style="${i === sel ? "background:var(--sand);font-weight:600" : ""}">${v}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" direction="ltr" style="min-width:420px">${[0, 50, 100].map(v => `<text x="${pl - 6}" y="${H - pb - v * (H - pb - 12) / 100 + 4}" text-anchor="end">${v}%</text>`).join("")}${bars}</svg></div>
    <p class="disclaimer">${t(ALLOC.note)}</p>`;
}

/* ---------- tools ---------- */
function viewTools() {
  return `<div style="display:grid;gap:8px;max-width:64ch"><h1 style="font-size:clamp(28px,3.6vw,38px)">${t(UI.toolsTitle)}</h1><p class="muted">${t(UI.toolsLead)}</p></div>
    ${simBlock("inflation")}${simBlock("compound")}${simBlock("riskreward")}
    <div class="sim"><h4>${t({ en: "Asset allocation by profile", ar: "توزيع الأصول حسب الملف" })}</h4><div data-sim="alloc" class="sim" style="border:0;padding:0;background:none"><div class="sim-out"></div></div></div>`;
}

/* ---------- questionnaire ---------- */
const Q = S.q;
const qById = id => QUESTIONS.find(q => q.id === id);
const allAnswered = () => QUESTIONS.every(q => Q.ans[q.id] != null);
function reachable(i) {
  const id = STEPS[i];
  if (id === "intro") return true;
  for (let j = 1; j < i; j++) { const s = STEPS[j]; if (s === "self") { if (Q.self == null) return false; } else if (s !== "result" && Q.ans[s] == null) return false; }
  return true;
}
function scores() {
  let R = 0, Lq = 0;
  QUESTIONS.forEach(q => { const a = Q.ans[q.id]; if (a == null) return; const p = q.opts[a].p; if (q.part === "R") R += p; else Lq += p; });
  return { R, L: Lq };
}
const band = (v, b) => v < b[1] ? 0 : v < b[2] ? 1 : v < b[3] ? 2 : 3;
function profileFor(R, Lq) { return MATRIX[band(R, R_BOUNDS)][band(Lq, L_BOUNDS)]; }

function viewQuiz() {
  const done = QUESTIONS.filter(q => Q.ans[q.id] != null).length + (Q.self != null ? 1 : 0);
  const total = QUESTIONS.length + 1;
  const group = (label, ids) => `<li class="part">${t(label)}</li>` + ids.map(id => {
    const i = STEPS.indexOf(id), isDone = id === "self" ? Q.self != null : id === "intro" ? true : id === "result" ? false : Q.ans[id] != null;
    const lbl = id === "intro" ? UI.about : id === "result" ? UI.results : SHORT[id];
    return `<li class="${isDone && id !== "intro" ? "done" : ""}"><button data-step="${i}" ${Q.step === i ? 'aria-current="step"' : ""} ${reachable(i) ? "" : "disabled"}><span class="tick">${isDone && id !== "intro" ? "✓" : ""}</span>${t(lbl)}</button></li>`;
  }).join("");
  return `<div class="quiz">
    <aside class="rail">
      <div class="eyebrow">${t(UI.qTitle)}</div>
      <div class="progress"><i style="width:${done / total * 100}%"></i></div>
      <div class="muted num" style="font-size:13px">${fill(pick(UI.answered), { a: done, b: total })}</div>
      <ol>${group(UI.about, ["intro"])}${group(UI.partI, QUESTIONS.filter(q => q.part === "R").map(q => q.id))}${group(UI.partII, QUESTIONS.filter(q => q.part === "L").map(q => q.id))}${group(UI.partIII, ["self"])}${group(UI.results, ["result"])}</ol>
      <label class="adv"><input type="checkbox" id="allHelp" ${Q.allHelp ? "checked" : ""}> ${t(UI.showAllHelp)}</label>
      <label class="adv"><input type="checkbox" id="showPts" ${Q.showPts ? "checked" : ""}> ${t(UI.showPts)}</label>
    </aside>
    <div class="qcard" id="qcard">${stepView()}</div>
  </div>`;
}
function stepView() {
  const id = STEPS[Q.step];
  if (id === "intro") return `
    <div class="eyebrow">${t(UI.about)}</div><h2>${t(UI.introH)}</h2>
    <p>${t(UI.introP)}</p>
    <div class="fields"><label class="field">${t(UI.nameL)}<input id="qName" autocomplete="name" value="${esc(Q.name)}"></label><label class="field">${t(UI.dateL)}<input id="qDate" type="date" value="${esc(Q.date)}"></label></div>
    <p class="muted" style="display:flex;gap:8px;align-items:center;font-size:14px">${icon("shield", "ic16")} ${t(UI.privacy)}</p>
    <div class="qnav"><span></span><button class="btn primary" data-nav="1">${t(UI.start)}</button></div>`;
  if (id === "result") return resultView();
  const isSelf = id === "self", q = isSelf ? null : qById(id);
  const partLbl = isSelf ? UI.partIII : q.part === "R" ? UI.partI : UI.partII;
  const num = Q.step; // 1..12
  const open = Q.allHelp || Q.open[id];
  const help = isSelf ? UI.selfHelp : q.help, ex = isSelf ? UI.selfEx : q.ex;
  const cur = isSelf ? Q.self : Q.ans[id];
  const opts = isSelf ? PROFILES.map((p, i) => `<label class="opt${cur === i ? " on" : ""}"><input type="radio" name="opt" value="${i}" ${cur === i ? "checked" : ""}><span class="dot"></span><span class="body"><b>${t(p.name)}</b><small>${t(p.text)}</small></span></label>`).join("")
    : q.opts.map((o, i) => `<label class="opt${cur === i ? " on" : ""}"><input type="radio" name="opt" value="${i}" ${cur === i ? "checked" : ""}><span class="dot"></span><span class="body"><span>${t(o.t)}</span>${q.range ? rangeViz(o) : ""}</span>${Q.showPts ? `<span class="pts">${o.p} ${t(UI.pts)}</span>` : ""}</label>`).join("");
  const last = id === "self";
  return `
    <div class="eyebrow">${t(partLbl)} · ${num} / 12</div>
    <h2 id="qh">${isSelf ? t(UI.selfQ) : t(q.q)}</h2>
    ${Q.allHelp ? "" : `<button class="help-toggle" data-help="${id}" aria-expanded="${!!open}">${icon("info", "ic16")} ${open ? t(UI.hide) : t(UI.explain)}</button>`}
    ${open ? `<div class="help"><p><b>${t(UI.whatMeans)}.</b> ${t(help)}</p><p class="ex"><b>${t(UI.forExample)}:</b> ${t(ex)}</p></div>` : ""}
    <div class="opts" role="radiogroup" aria-labelledby="qh">${opts}</div>
    <div class="qnav"><button class="btn ghost" data-nav="-1">${t(UI.back)}</button><button class="btn primary" data-nav="1" ${cur == null ? "disabled" : ""}>${last ? t(UI.seeResult) : t(UI.cont)}</button></div>`;
}
function rangeViz(o) {
  const lo = 0.6, hi = 1.5, P = v => ((v - lo) / (hi - lo)) * 100;
  const pct = v => (v >= 1 ? "+" : "−") + Math.round(Math.abs(v - 1) * 100) + "%";
  return `<span class="range-viz" dir="ltr" aria-hidden="true"><span class="dn" style="left:${P(o.lo)}%;width:${P(1) - P(o.lo)}%"></span><span class="up" style="left:${P(1)}%;width:${P(o.hi) - P(1)}%"></span><span class="base" style="left:${P(1)}%"></span></span><small dir="ltr" style="text-align:${S.lang === "ar" ? "right" : "left"}">${pct(o.lo)} / ${pct(o.hi)}</small>`;
}
function rerenderQuiz() { const v = $("#view"); v.innerHTML = viewQuiz(); bindSims(v); }
document.addEventListener("click", e => {
  if (S.view !== "quiz") return;
  const st = e.target.closest("[data-step]");
  if (st && !st.disabled) { Q.step = +st.dataset.step; rerenderQuiz(); scrollQ(); return; }
  const nv = e.target.closest("[data-nav]");
  if (nv && !nv.disabled) { Q.step = Math.max(0, Math.min(STEPS.length - 1, Q.step + +nv.dataset.nav)); rerenderQuiz(); scrollQ(); return; }
  const h = e.target.closest("[data-help]");
  if (h) { Q.open[h.dataset.help] = !Q.open[h.dataset.help]; rerenderQuiz(); return; }
  const a = e.target.closest("[data-act]");
  if (a) {
    const act = a.dataset.act;
    if (act === "copy") copySummary();
    if (act === "print") window.print();
    if (act === "edit") { Q.step = 1; rerenderQuiz(); scrollQ(); }
    if (act === "restart") { Object.assign(Q, { step: 0, ans: {}, self: null, name: "", open: {} }); rerenderQuiz(); scrollQ(); }
  }
});
document.addEventListener("change", e => {
  if (S.view !== "quiz") return;
  if (e.target.name === "opt") {
    const id = STEPS[Q.step], v = +e.target.value;
    if (id === "self") Q.self = v; else Q.ans[id] = v;
    const y = window.scrollY; rerenderQuiz(); window.scrollTo(0, y);
    const nb = document.querySelector('.qnav [data-nav="1"]'); if (nb) nb.focus({ preventScroll: true });
  }
  if (e.target.id === "allHelp") { Q.allHelp = e.target.checked; rerenderQuiz(); }
  if (e.target.id === "showPts") { Q.showPts = e.target.checked; rerenderQuiz(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "qName") Q.name = e.target.value;
  if (e.target.id === "qDate") Q.date = e.target.value;
});
function scrollQ() { const c = $("#qcard"); if (c && c.getBoundingClientRect().top < 0) c.scrollIntoView({ block: "start" }); else if (window.innerWidth < 860) window.scrollTo(0, 0); }

/* ---------- results ---------- */
function matrixSVG(pos) {
  const cell = 92, ox = 58, oy = 10, n = 4, size = cell * n;
  const W = ox + size + 12, H = oy + size + 50;
  const colors = { 1: ["var(--p1)", "var(--p1-ink)"], 2: ["var(--p2)", "var(--p2-ink)"], 3: ["var(--p3)", "var(--p3-ink)"], 4: ["var(--p4)", "var(--p4-ink)"] };
  let g = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const p = MATRIX[r][c], x = ox + c * cell, y = oy + (n - 1 - r) * cell;
    g += `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" fill="${colors[p][0]}" stroke="var(--surface)" stroke-width="2"/><text x="${x + cell / 2}" y="${y + cell / 2 + 6}" text-anchor="middle" style="fill:${colors[p][1]};font-size:17px;font-weight:600;opacity:.85">${p}</text>`;
  }
  const xr = v => { const b = L_BOUNDS; const i = Math.min(3, band(v, b)); return ox + (i + (v - b[i]) / (b[i + 1] - b[i])) * cell; };
  const yr = v => { const b = R_BOUNDS; const i = Math.min(3, band(v, b)); return oy + size - (i + (v - b[i]) / (b[i + 1] - b[i])) * cell; };
  const ticksX = L_BOUNDS.map((v, i) => `<text x="${ox + i * cell}" y="${oy + size + 16}" text-anchor="middle">${v}</text>`).join("");
  const ticksY = R_BOUNDS.map((v, i) => `<text x="${ox - 8}" y="${oy + size - i * cell + 4}" text-anchor="end">${v}</text>`).join("");
  let mark = "";
  if (pos) {
    const x = xr(pos.L), y = yr(pos.R);
    mark = `<circle cx="${x}" cy="${y}" r="13" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/><circle cx="${x}" cy="${y}" r="5" fill="var(--ink)"/><text x="${x}" y="${y - 19}" text-anchor="middle" style="fill:var(--ink);font-weight:700;font-size:13px;paint-order:stroke;stroke:var(--surface);stroke-width:4px">${t(UI.you)}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" direction="ltr" role="img" aria-label="${t(UI.matrixT)}" style="width:100%;height:auto;display:block">${g}${ticksX}${ticksY}
    <text x="${ox + size / 2}" y="${oy + size + 38}" text-anchor="middle" style="font-weight:600;fill:var(--ink)">${t(UI.axisL)}</text>
    <text x="14" y="${oy + size / 2}" text-anchor="middle" transform="rotate(-90 14 ${oy + size / 2})" style="font-weight:600;fill:var(--ink)">${t(UI.axisR)}</text>${mark}</svg>`;
}
function resultView() {
  if (!allAnswered() || Q.self == null) { Q.step = 1; return stepView(); }
  const { R, L: Lq } = scores(), prof = profileFor(R, Lq), P = PROFILES[prof - 1], self = PROFILES[Q.self], ok = self.n === prof;
  const rows = QUESTIONS.map(q => `<tr><td><b>${q.id}</b> · ${t(SHORT[q.id])}</td><td>${t(q.opts[Q.ans[q.id]].t)}</td><td class="p">${q.opts[Q.ans[q.id]].p}</td></tr>`).join("");
  return `
    <div class="result-head">
      <div style="display:grid;gap:8px"><div class="eyebrow">${t(UI.yourProfile)}${Q.name ? " · " + esc(Q.name) : ""}${Q.date ? " · " + esc(Q.date) : ""}</div>
      <div><span class="badge p${prof}">${prof} · ${t(P.name)}</span></div>
      <p style="max-width:62ch">${t(P.text)}</p></div>
    </div>
    <div class="scores">
      <div class="meter"><div class="top"><span class="muted">${t(UI.riskScore)}</span><b>${R}<small class="muted" style="font-size:15px"> / 120</small></b></div><div class="bar2"><i style="width:${R / 120 * 100}%"></i></div><small class="muted">${t(UI.riskNote)}</small></div>
      <div class="meter"><div class="top"><span class="muted">${t(UI.liqScore)}</span><b>${Lq}<small class="muted" style="font-size:15px"> / 100</small></b></div><div class="bar2"><i style="width:${Lq}%"></i></div><small class="muted">${t(UI.liqNote)}</small></div>
    </div>
    <div class="verdict ${ok ? "ok" : "no"}"><b>${ok ? t(UI.inLine) : t(UI.notInLine)}</b><p>${esc(fill(pick(ok ? UI.inLineP : UI.notInLineP), { s: pick(self.name), c: pick(P.name) }))}</p></div>
    <h3 style="font-size:20px">${t(UI.matrixT)}</h3>
    <div class="matrix-wrap"><div class="matrix">${matrixSVG({ R, L: Lq })}</div>
      <div class="legend">${PROFILES.map(p => `<div><i style="background:var(--p${p.n})"></i>${p.n} = ${t(p.name)}</div>`).join("")}</div></div>
    <details ${Q.showPts ? "open" : ""}><summary style="cursor:pointer;font-weight:600">${t(UI.answersT)}</summary>
      <div class="tblwrap" style="margin-top:10px"><table class="ans-table"><thead><tr><th>${t(UI.colQ)}</th><th>${t(UI.colA)}</th><th style="text-align:end">${t(UI.colP)}</th></tr></thead>
      <tbody>${rows}<tr><td><b>${t(UI.partIII)}</b></td><td>${t(self.name)}</td><td class="p">–</td></tr></tbody>
      <tfoot><tr><td colspan="2">${t(UI.total)} R / L</td><td class="p">${R} / ${Lq}</td></tr></tfoot></table></div></details>
    <div class="actions">
      <button class="btn primary" data-act="copy">${t(UI.copy)}</button>
      ${isFramed ? "" : `<button class="btn ghost" data-act="print">${t(UI.print)}</button>`}
      <button class="btn ghost" data-act="edit">${t(UI.edit)}</button>
      <button class="btn ghost" data-go="learn">${t(UI.learnMore)}</button>
      <button class="btn ghost" data-act="restart">${t(UI.restart)}</button>
    </div>
    <textarea id="sumtxt" readonly hidden style="width:100%;min-height:200px;font:13px/1.5 ui-monospace,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px"></textarea>`;
}
function summaryText() {
  const { R, L: Lq } = scores(), prof = profileFor(R, Lq), self = PROFILES[Q.self];
  const lines = [
    pick(UI.qTitle) + " · Midstar",
    (Q.name ? pick(UI.nameL).replace(/\s*\(.*\)/, "") + ": " + Q.name + "\n" : "") + pick(UI.dateL) + ": " + Q.date,
    "",
    ...QUESTIONS.map(q => `${q.id} ${pick(SHORT[q.id])}: ${pick(q.opts[Q.ans[q.id]].t)} [${q.opts[Q.ans[q.id]].p}]`),
    "",
    `Total R = ${R} / 120 · Total L = ${Lq} / 100`,
    `${pick(UI.yourProfile)}: ${prof} – ${pick(PROFILES[prof - 1].name)}`,
    `${pick(UI.partIII)}: ${self.n} – ${pick(self.name)}`,
    (self.n === prof ? pick(UI.inLine) : pick(UI.notInLine)).toUpperCase(),
  ];
  return lines.join("\n");
}
function toast(msg) { const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
function copySummary() {
  const txt = summaryText();
  const fallback = () => { const ta = $("#sumtxt"); ta.hidden = false; ta.value = txt; ta.focus(); ta.select(); toast(pick(UI.copyFail)); };
  try { navigator.clipboard.writeText(txt).then(() => toast(pick(UI.copied)), fallback); } catch (e) { fallback(); }
}

render();

</script>
</body>
